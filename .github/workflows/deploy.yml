name: CI/CD

on:
  push:
    branches: ["main"]

jobs:
  build:
    name: Build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: node --check src/app.js
      - run: npm audit --omit=dev --audit-level=high

  deploy:
    name: Deploy to VM
    needs: build
    runs-on: [self-hosted, kikan-vm]
    steps:
      - name: Pull, install, restart
        run: |
          cd ~/kikan-app
          git pull origin main
          npm install --omit=dev
          export XDG_RUNTIME_DIR=/run/user/$(id -u)
          systemctl --user restart kikan-app
          sleep 2
          systemctl --user is-active kikan-app
